# Monthly research update (ROADMAP 8.1, 8.2; D18, D19 = C).
#
# 1. Checks the source data for newer releases (scripts/check_source_updates.py) and opens an issue if any.
# 2. Adds the claims of the URLs in data/research/source_urls.txt that aren't processed yet
#    (scripts/research/update_research.py --run), and opens a pull request with the changed app files.
# 3. Keeps the run's state (claims, chunks, paid-answer caches) as an asset of the `pipeline-state` release,
#    outside the code history; the previous archive stays as pipeline-state.previous.tar.gz.
#
# Needs, once: the OPENAI_API_KEY repository secret, the `pipeline-state` release with the first archive, and
# Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
# With no new URLs, nothing is changed, uploaded or paid for.

name: Monthly research update

on:
  schedule:
    - cron: "0 6 1 * *"  # the 1st of each month, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: research-update  # two runs at once would both pay for the same sources and overwrite each other's state

permissions:
  contents: write       # push the branch, upload the state asset
  pull-requests: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-research.lock.txt

      - name: Install the research packages (CPU-only PyTorch)
        run: python -m pip install -r requirements-research.lock.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Check the source data for updates
        run: |
          if ! python scripts/check_source_updates.py > "$RUNNER_TEMP/updates.txt"; then
            cat "$RUNNER_TEMP/updates.txt"
            gh issue create --title "Source data updates ($(date +%Y-%m))" \
              --body "$(printf 'scripts/check_source_updates.py found:\n\n```\n%s\n```\n\nRun: %s' "$(cat "$RUNNER_TEMP/updates.txt")" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          fi

      - name: Build the O*NET database
        run: |
          python scripts/download_sources.py --only onet/
          python scripts/onet/build_onet_duckdb.py data/onet/db_31_0/db_31_0_text data/duckdb/onet.duckdb

      - name: Restore the state of the previous run
        run: |
          gh release download pipeline-state --pattern pipeline-state.tar.gz --dir "$RUNNER_TEMP/state"
          python scripts/research/pipeline_state.py unpack "$RUNNER_TEMP"/state/pipeline-state.tar.gz

      - name: Add the new sources
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/research/update_research.py --run

      - name: Open a pull request with the changed app files
        id: pr
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new sources; nothing changed."
            exit 0
          fi
          branch="research-update-$(date +%Y-%m-%d)-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "Monthly research update: claims and translations for new sources"
          git push origin "$branch"
          gh pr create --head "$branch" --title "Monthly research update ($(date +%Y-%m))" \
            --body "Added by the monthly run. The log, with each step's token use, is at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Save the state for the next run
        if: steps.pr.outputs.changed == 'true'
        run: |
          cp "$RUNNER_TEMP"/state/pipeline-state.tar.gz "$RUNNER_TEMP"/state/pipeline-state.previous.tar.gz
          python scripts/research/pipeline_state.py pack "$RUNNER_TEMP"/state/new.tar.gz
          mv "$RUNNER_TEMP"/state/new.tar.gz "$RUNNER_TEMP"/state/pipeline-state.tar.gz
          gh release upload pipeline-state "$RUNNER_TEMP"/state/pipeline-state.previous.tar.gz "$RUNNER_TEMP"/state/pipeline-state.tar.gz --clobber
